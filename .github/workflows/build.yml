name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build (defaults to the triggering commit)'
        type: string
        default: ''
      version:
        description: 'Version embedded in the binaries (defaults to the triggering ref name)'
        type: string
        default: ''

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: "386" }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: "386" }
          - { os: windows, arch: amd64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use mise to install dependencies
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2025.12.13
          experimental: true
          install_args: go
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: go-cache-paths
        run: .github/scripts/go-cache-paths.sh

      - name: Go Build Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-${{ matrix.arch }}

      - name: Go Mod Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}-linux-amd64

      - name: Build binary
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: .github/scripts/build-binary.sh "$TARGET_OS" "$TARGET_ARCH" "$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt-iac-engine-opentofu_${{ matrix.os }}_${{ matrix.arch }}
          path: bin/terragrunt-iac-engine-opentofu_${{ matrix.os }}_${{ matrix.arch }}*
          if-no-files-found: error
